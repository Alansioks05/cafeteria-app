
spring:
  application:
    name: cafeteria-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cafeteria_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Bogota
    show-sql: false
    open-in-view: false

server:
  port: ${PORT:8080}

logging:
  level:
    org.hibernate.SQL: INFO

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

jwt:
  secret: ${JWT_SECRET:clave-local-de-desarrollo-no-usar-en-produccion-2026}
